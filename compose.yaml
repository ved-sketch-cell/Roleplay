x-api-environment: &api-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-roleplay}:${POSTGRES_PASSWORD:?Run setup_env}@db:5432/${POSTGRES_DB:-roleplay}
  JWT_SECRET: ${JWT_SECRET:?Run setup_env}
  OUTBOX_ENCRYPTION_KEY: ${OUTBOX_ENCRYPTION_KEY:?Run setup_env or setup_env --upgrade}
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT: ${ENVIRONMENT:-development}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:8080"]}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  RATE_LIMITS_ENABLED: "true"
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roleplay}
      POSTGRES_USER: ${POSTGRES_USER:-roleplay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup_env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
  api:
    build: ./backend
    environment: *api-environment
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --ws-max-size 16384"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  worker:
    build: ./backend
    environment: *api-environment
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  backup:
    profiles: ["backups"]
    build: ./ops/backup
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-roleplay}
      PGUSER: ${POSTGRES_USER:-roleplay}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run setup_env}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
