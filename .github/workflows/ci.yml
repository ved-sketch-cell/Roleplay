name: ROLEPLAY checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: roleplay_test
          POSTGRES_USER: roleplay
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roleplay -d roleplay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://roleplay:ci-only-disposable-password@127.0.0.1:5432/roleplay_test
      TEST_DATABASE_URL: postgresql+psycopg://roleplay:ci-only-disposable-password@127.0.0.1:5432/roleplay_test
      JWT_SECRET: ci-only-test-secret-never-use-in-production-123456
      ENVIRONMENT: test
      REDIS_URL: redis://127.0.0.1:6379/15
      TEST_REAL_REDIS_URL: redis://127.0.0.1:6379/15
      TEST_LIVE_API_URL: http://127.0.0.1:8000
      RATE_LIMITS_ENABLED: 'false'
      COOKIE_SECURE: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Generate disposable outbox key
        run: |
          python - <<'PY'
          import os
          from cryptography.fernet import Fernet
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('OUTBOX_ENCRYPTION_KEY=' + Fernet.generate_key().decode() + '\n')
          PY
      - run: ruff check app alembic tests scripts
      - run: alembic upgrade head
      - name: Start local API for wire-level socket tests
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 --ws-max-size 16384 > /tmp/roleplay-api.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/health/ready')
                  break
              except Exception:
                  time.sleep(.25)
          else:
              raise SystemExit('API did not become ready')
          PY
      - run: pytest -q
      - run: alembic check
      - name: Install age for encrypted restore drill
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Round-trip a real encrypted PostgreSQL backup
        env:
          ROLEPLAY_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PGUSER: roleplay
          PGPASSWORD: ci-only-disposable-password
        run: |
          set -euo pipefail
          mkdir -p /tmp/roleplay-pg-tools /tmp/roleplay-ci-backups
          cat > /tmp/roleplay-pg-tools/pg_dump <<'SH'
          #!/usr/bin/env bash
          exec docker exec -e PGPASSWORD="$PGPASSWORD" "$ROLEPLAY_POSTGRES_CONTAINER" pg_dump "$@" -U "$PGUSER" -d "$PGDATABASE"
          SH
          cat > /tmp/roleplay-pg-tools/psql <<'SH'
          #!/usr/bin/env bash
          exec docker exec -i -e PGPASSWORD="$PGPASSWORD" "$ROLEPLAY_POSTGRES_CONTAINER" psql "$@" -U "$PGUSER" -d "$PGDATABASE"
          SH
          cat > /tmp/roleplay-pg-tools/pg_restore <<'SH'
          #!/usr/bin/env bash
          exec docker exec -i -e PGPASSWORD="$PGPASSWORD" "$ROLEPLAY_POSTGRES_CONTAINER" pg_restore "$@" -U "$PGUSER"
          SH
          chmod 755 /tmp/roleplay-pg-tools/*
          export PATH="/tmp/roleplay-pg-tools:$PATH"
          age-keygen -o /tmp/roleplay-ci-backup-key.txt
          export BACKUP_AGE_RECIPIENT="$(age-keygen -y /tmp/roleplay-ci-backup-key.txt)"
          export BACKUP_DIR=/tmp/roleplay-ci-backups PGDATABASE=roleplay_test
          bash ../ops/backup/backup.sh once
          archive=(/tmp/roleplay-ci-backups/*.dump.age)
          docker exec -e PGPASSWORD="$PGPASSWORD" "$ROLEPLAY_POSTGRES_CONTAINER" createdb -U "$PGUSER" roleplay_restore_test
          export PGDATABASE=roleplay_restore_test
          bash ../ops/backup/restore-test.sh "${archive[0]}" /tmp/roleplay-ci-backup-key.txt
          source_count="$(docker exec -e PGPASSWORD="$PGPASSWORD" "$ROLEPLAY_POSTGRES_CONTAINER" psql -U "$PGUSER" -d roleplay_test -Atc 'SELECT count(*) FROM users')"
          restored_count="$(psql -Atc 'SELECT count(*) FROM users')"
          [[ "$source_count" == "$restored_count" ]]
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:journeys
      - run: pnpm run build
